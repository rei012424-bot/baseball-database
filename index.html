<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLUGGER ANALYTICS</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const INITIAL_MATCHES = [
      { id: 1, date: '2026-04-12', type: '公式戦', opponent: 'レッドスターズ', ab: 4, h: 2, b2: 1, b3: 0, hr: 1, bb: 0, sf: 0 },
      { id: 2, date: '2026-04-19', type: '練習試合', opponent: 'フェニックス', ab: 3, h: 1, b2: 1, b3: 0, hr: 0, bb: 1, sf: 0 },
      { id: 3, date: '2026-04-26', type: 'トーナメント', opponent: 'インフィニティ', ab: 4, h: 3, b2: 2, b3: 0, hr: 0, sf: 1 },
      { id: 4, date: '2026-05-03', type: '公式戦', opponent: 'ブラックタイガース', ab: 3, h: 0, b2: 0, b3: 0, hr: 0, bb: 2, sf: 0 }
    ];

    function App() {
      const [matches, setMatches] = useState(() => {
        const saved = localStorage.getItem('baseball_matches_v4');
        return saved ? JSON.parse(saved) : INITIAL_MATCHES;
      });
      const [filterType, setFilterType] = useState('すべて');
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [notification, setNotification] = useState(null);
      const [formData, setFormData] = useState({
        date: new Date().toISOString().split('T')[0],
        type: '公式戦',
        opponent: '',
        ab: 3, h: 1, b2: 0, b3: 0, hr: 0, bb: 1, sf: 0
      });

      useEffect(() => {
        localStorage.setItem('baseball_matches_v4', JSON.stringify(matches));
      }, [matches]);

      const showNotify = (msg) => {
        setNotification(msg);
        setTimeout(() => setNotification(null), 3000);
      };

      const filtered = filterType === 'すべて' ? matches : matches.filter(m => m.type === filterType);
      
      const stats = useMemo(() => {
        const totalAB = filtered.reduce((acc, m) => acc + Number(m.ab), 0);
        const totalH = filtered.reduce((acc, m) => acc + Number(m.h), 0);
        const total2B = filtered.reduce((acc, m) => acc + Number(m.b2), 0);
        const total3B = filtered.reduce((acc, m) => acc + Number(m.b3), 0);
        const totalHR = filtered.reduce((acc, m) => acc + Number(m.hr), 0);
        const totalBB = filtered.reduce((acc, m) => acc + Number(m.bb), 0);
        const totalSF = filtered.reduce((acc, m) => acc + Number(m.sf), 0);
        
        const totalTB = totalH + total2B + (total3B * 2) + (totalHR * 3);
        const avg = totalAB > 0 ? (totalH / totalAB).toFixed(3) : '.000';
        const obpDenom = totalAB + totalBB + totalSF;
        const obp = obpDenom > 0 ? ((totalH + totalBB) / obpDenom).toFixed(3) : '.000';
        const slg = totalAB > 0 ? (totalTB / totalAB).toFixed(3) : '.000';
        
        return {
          games: filtered.length,
          ab: totalAB,
          h: totalH,
          avg: avg.replace(/^0\./, ''),
          obp: obp.replace(/^0\./, ''),
          ops: (Number(obp) + Number(slg)).toFixed(3).replace(/^0\./, '')
        };
      }, [filtered]);

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 p-4 max-w-md mx-auto">
          {notification && (
            <div className="fixed top-4 right-4 bg-emerald-500 text-slate-950 px-4 py-2 rounded-xl shadow-lg font-bold z-50">
              {notification}
            </div>
          )}

          <header className="flex justify-between items-center mb-6">
            <h1 className="text-xl font-black tracking-wider text-emerald-400">SLUGGER ANALYTICS</h1>
            <button
              onClick={() => showNotify('モーダル機能')}
              className="bg-[#00f5a0] text-[#07090e] font-bold px-3.5 py-2 rounded-xl text-xs"
            >
              + 記録追加
            </button>
          </header>

          <div className="flex space-x-2 mb-6 bg-slate-900 p-1 rounded-xl">
            {['すべて', '公式戦', '練習試合', 'トーナメント'].map((type) => (
              <button
                key={type}
                onClick={() => setFilterType(type)}
                className={`flex-1 py-1.5 px-3 rounded-lg text-xs font-medium ${
                  filterType === type 
                    ? 'bg-gradient-to-r from-emerald-400 to-teal-500 text-[#07090e] font-bold' 
                    : 'text-slate-400'
                }`}
              >
                {type}
              </button>
            ))}
          </div>

          <div>
            <h2 className="text-sm font-bold text-slate-400 mb-3">BATTING DASHBOARD</h2>
            <div className="grid grid-cols-3 gap-3">
              <div className="bg-slate-900 border border-slate-800 p-3 rounded-2xl">
                <div className="text-xs text-slate-400 mb-1">打率 (AVG)</div>
                <div className="text-2xl font-black text-emerald-400">.{stats.avg}</div>
              </div>
              <div className="bg-slate-900 border border-slate-800 p-3 rounded-2xl">
                <div className="text-xs text-slate-400 mb-1">出塁率 (OBP)</div>
                <div className="text-2xl font-black text-teal-400">.{stats.obp}</div>
              </div>
              <div className="bg-slate-900 border border-slate-800 p-3 rounded-2xl">
                <div className="text-xs text-slate-400 mb-1">OPS</div>
                <div className="text-2xl font-black text-cyan-400">.{stats.ops}</div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
